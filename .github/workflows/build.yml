# TrollStore 云端编译：TrollLyricsDesk v1.0.2
# 做法照分屏那套（macOS runner + 签名，不需要任何密钥/ Secret，不需要 Mac）。
# 区别：这是 Xcode 工程（SwiftUI App + Widget Extension），不用 Theos；
# 先 xcodebuild 不签名导出（archive），再按 entitlements 签名，
# 最后打成 .ipa。推代码就自动跑；跑完在该次运行的 Artifacts 里下载
# TrollLyricsDesk-1.0.2.ipa。
# 签名工具：zsign（Homebrew 1.1.3）。ldid 走不通了——
# procursus7（2023 年）和 procursus8（2026-11-17 最新版）都读不懂
# Xcode 26.6 编出的 Mach-O（Unknown header magic；run 45535776981、
# 45536337461、45549765086 三次都卡在签名那步）。
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install zsign
        # zsign：一直在维护的跨平台签名工具（MIT），能读 Xcode 26.6 的 Mach-O，
        # 临时签名（-a）不需要任何证书或密钥，跟 ldid 一样适合 TrollStore。
        # Homebrew 公式 zsign 现行是 1.1.3。
        run: |
          brew update
          brew install zsign
          brew list --versions zsign
          zsign -v

      - name: Archive (unsigned)
        run: |
          xcodebuild -project TrollLyricsDesk.xcodeproj \
            -scheme TrollLyricsDesk \
            -configuration Release \
            -archivePath build/TrollLyricsDesk.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Verify archive layout
        run: |
          APP=build/TrollLyricsDesk.xcarchive/Products/Applications/TrollLyricsDesk.app
          ls -la "$APP"
          ls -la "$APP/PlugIns/"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/PlugIns/TrollLyricsWidget.appex/Info.plist"

      - name: Sign with zsign (TrollStore)
        # 跟之前 ldid 的做法一样：App 和 Widget 各按自己的 entitlements 文件签，
        # 各签各的二进制（zsign 支持直接签 Mach-O，-a 是临时签名，-f 不用缓存）。
        # 整包一起签会把 App 的 entitlements 也套到 Widget 上，所以分开签。
        run: |
          APP=build/TrollLyricsDesk.xcarchive/Products/Applications/TrollLyricsDesk.app
          zsign -a -f -e TrollLyricsDesk/TrollLyricsDesk.entitlements "$APP/TrollLyricsDesk"
          zsign -a -f -e TrollLyricsWidget/TrollLyricsWidget.entitlements "$APP/PlugIns/TrollLyricsWidget.appex/TrollLyricsWidget"
          echo "--- app entitlements ---"
          codesign -d --entitlements - "$APP/TrollLyricsDesk"
          echo "--- widget entitlements ---"
          codesign -d --entitlements - "$APP/PlugIns/TrollLyricsWidget.appex/TrollLyricsWidget"

      - name: Package IPA
        run: |
          rm -rf Payload TrollLyricsDesk-1.0.2.ipa
          mkdir Payload
          cp -r build/TrollLyricsDesk.xcarchive/Products/Applications/TrollLyricsDesk.app Payload/
          zip -qr TrollLyricsDesk-1.0.2.ipa Payload
          ls -la TrollLyricsDesk-1.0.2.ipa
          unzip -l TrollLyricsDesk-1.0.2.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollLyricsDesk-1.0.2
          path: TrollLyricsDesk-1.0.2.ipa
